        if (!resp.ok)
            throw Error(`HTTP ${resp.status}`);
        const js = await resp.json();
        if (!Array.isArray(js) || !js.length)
            throw Error('Bibliothèque invalide');
        guides = js;
        data = loaded;
        render();
        if (false && 'serviceWorker' in navigator && location.protocol !== 'file:')
            navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(e => console.warn('Service Worker', e));
    }
    catch (e) {
        app.innerHTML = `<div class="fatal"><h1>ARCGUIDE</h1><h2>Bibliothèque indisponible</h2><p>Ouvre l'application une première fois avec une connexion Internet pour installer les ressources locales.</p><p class="small-muted">${esc(e instanceof Error ? e.message : String(e))}</p><button class="btn primary" onclick="location.reload()">Réessayer</button></div>`;
    }
}
void boot();
</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("SW",e))}</script></body></html>
